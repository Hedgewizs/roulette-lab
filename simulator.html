<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roulette Lab — Wheel Simulator (Single, Double & Triple Zero)</title>
<meta name="description" content="Interactive roulette simulator: single-zero, double-zero and triple-zero wheels with correct layouts, la partage option. Free, bilingual.">
<link rel="stylesheet" href="styles.css">
<script src="i18n.js"></script>
<script src="roulette-wheel.js"></script>
<script>
Object.assign(I18N.en,{
  sim_title:"Wheel Simulator", sim_intro:"Pick your wheel — single, double, or triple zero — then pick a chip, click the layout, spin. The edge is printed on every wheel.",
  variant:"Wheel", edge_is:"House edge",
  chip:"Chip", spin:"SPIN", spinning:"Spinning…", clear:"Clear bets",
  lapartage:"La partage (even-money bets lose half on zero) — single zero only",
  your_bets:"Your bets", no_bets:"No bets placed — click the layout.",
  result:"Result", won:"won", lost:"lost", pushed_half:"half back (la partage)",
  spins:"spins", pl:"P&L", hit_rate:"hit rate",
  new_session:"New session",
  dozen1:"1st 12", dozen2:"2nd 12", dozen3:"3rd 12",
  col:"Column", red:"Red", black:"Black", odd:"Odd", even:"Even", low:"1–18", high:"19–36",
  basket:"Basket (0,00,1,2,3) 6:1",
  worst_flag:"⚠️ worst wheel in the casino",
  best_flag:"✅ best wheel in the casino",
  triple_note:"Triple-zero wheels (found at some Vegas casinos) charge 7.69% on every bet — nearly triple the European price for the identical game.",
  callbets:"French call bets",
  voisins:"Voisins du Zéro",
  tiers:"Tiers du Cylindre",
  orphelins:"Orphelins",
  jeuzero:"Jeu Zéro",
});
Object.assign(I18N.zh,{
  sim_title:"輪盤模擬器", sim_intro:"選你的輪盤——單零、雙零或三零——選籌碼、點版面、轉動。每個輪盤的優勢都印在上面。",
  variant:"輪盤", edge_is:"莊家優勢",
  chip:"籌碼", spin:"轉動", spinning:"轉動中…", clear:"清除注碼",
  lapartage:"La partage（均等注開 0 只輸一半）——僅限單零",
  your_bets:"你的注碼", no_bets:"還沒下注——點版面。",
  result:"結果", won:"贏", lost:"輸", pushed_half:"退回一半（la partage）",
  spins:"轉數", pl:"損益", hit_rate:"中獎率",
  new_session:"新 session",
  dozen1:"第一打", dozen2:"第二打", dozen3:"第三打",
  col:"列", red:"紅", black:"黑", odd:"單", even:"雙", low:"1–18", high:"19–36",
  basket:"籃子注（0,00,1,2,3）6:1",
  worst_flag:"⚠️ 賭場最爛的輪盤",
  best_flag:"✅ 賭場最好的輪盤",
  triple_note:"三零輪盤（部分 Vegas 賭場有）每種注收 7.69%——同樣的遊戲，價格是歐式的將近三倍。",
  callbets:"法式喊注",
  voisins:"Voisins du Zéro",
  tiers:"Tiers du Cylindre",
  orphelins:"Orphelins",
  jeuzero:"Jeu Zéro",
});
const OUTSIDE = [
  {id:'d1', pay:2, label:'dozen1', test:n=>n>=1&&n<=12},
  {id:'d2', pay:2, label:'dozen2', test:n=>n>=13&&n<=24},
  {id:'d3', pay:2, label:'dozen3', test:n=>n>=25&&n<=36},
  {id:'c1', pay:2, label:'col', col:1, test:n=>!isZero(n)&&n%3===1},
  {id:'c2', pay:2, label:'col', col:2, test:n=>!isZero(n)&&n%3===2},
  {id:'c3', pay:2, label:'col', col:3, test:n=>!isZero(n)&&n%3===0},
  {id:'red', pay:1, even:true, label:'red', test:n=>isRed(n)},
  {id:'black', pay:1, even:true, label:'black', test:n=>!isZero(n)&&!isRed(n)},
  {id:'odd', pay:1, even:true, label:'odd', test:n=>!isZero(n)&&n%2===1},
  {id:'even', pay:1, even:true, label:'even', test:n=>!isZero(n)&&n%2===0},
  {id:'low', pay:1, even:true, label:'low', test:n=>n>=1&&n<=18},
  {id:'high', pay:1, even:true, label:'high', test:n=>n>=19&&n<=36},
];
const BASKET_NUMS = [0,'00',1,2,3];
// French call bets (single zero only). Each = list of {nums, pay} component bets.
const CALLBETS = {
  voisins: { chips:9, parts:[
    {nums:[0,2,3], pay:11, units:2}, {nums:[4,7], pay:17, units:1}, {nums:[12,15], pay:17, units:1},
    {nums:[18,21], pay:17, units:1}, {nums:[19,22], pay:17, units:1}, {nums:[25,26,28,29], pay:8, units:2},
    {nums:[32,35], pay:17, units:1} ]},
  tiers: { chips:6, parts:[
    {nums:[5,8], pay:17, units:1}, {nums:[10,11], pay:17, units:1}, {nums:[13,16], pay:17, units:1},
    {nums:[23,24], pay:17, units:1}, {nums:[27,30], pay:17, units:1}, {nums:[33,36], pay:17, units:1} ]},
  orphelins: { chips:5, parts:[
    {nums:[1], pay:35, units:1}, {nums:[6,9], pay:17, units:1}, {nums:[14,17], pay:17, units:1},
    {nums:[17,20], pay:17, units:1}, {nums:[31,34], pay:17, units:1} ]},
  jeuzero: { chips:4, parts:[
    {nums:[26], pay:35, units:1}, {nums:[0,3], pay:17, units:1}, {nums:[12,15], pay:17, units:1},
    {nums:[32,35], pay:17, units:1} ]},
};
let bets=[], bankroll=500, startBank=500, chip=5, spinning=false;
let stats={spins:0, wins:0, wagered:0};
let variant='eu';

function setVariant(v){
  if(spinning) return;
  variant=v; bets=[];
  document.getElementById('lapartage').disabled = (v!=='eu');
  if(v!=='eu') document.getElementById('lapartage').checked=false;
  buildLayout(); renderEdge(); renderBets(); renderStats(); renderCallBets();
  drawWheel(document.getElementById('wheel'), 0, -1, variant);
}
function renderEdge(){
  const e = variantEdge(variant), v = VARIANTS[variant];
  const flag = variant==='eu' ? ` <span class="pos">${t('best_flag')}</span>`
    : variant==='z3' ? ` <span class="neg">${t('worst_flag')}</span>` : '';
  document.getElementById('edgebar').innerHTML =
    `<b>${t('variant')}:</b> ${(LANG==='zh'?v.zh:v.en)} &nbsp;·&nbsp; <b>${t('edge_is')}:</b> <span class="neg">${(e*100).toFixed(2)}%</span>${flag}` +
    (variant==='z3' ? `<div class="muted" style="margin-top:6px">${t('triple_note')}</div>` : '');
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.toggle('sel', b.dataset.v===variant));
}
function buildLayout(){
  const g = document.getElementById('rgrid');
  const zeros = variant==='eu' ? ['0'] : variant==='us' ? ['0','00'] : ['0','00','000'];
  const zspan = zeros.length===1 ? 3 : Math.floor(12/zeros.length);
  let h = zeros.map(z=>`<div class="rnum zero" data-bet="n${z}" data-num="${z}" style="grid-row:span ${zspan}">${z}</div>`).join('');
  // numbers 1-36 in layout order: rows of 3 (3,2,1 / 6,5,4 ...)
  for(let row=0; row<12; row++){
    for(let c=0;c<3;c++){
      const n = row*3 + (3-c);
      const cls = isRed(n)?'red':'black';
      h += `<div class="rnum ${cls}" data-bet="n${n}" data-num="${n}">${n}</div>`;
    }
  }
  const zcols = zeros.length;
  // dozens row
  h += `<div class="rout" data-bet="d1" style="grid-column:${1+zcols}/span 4">${t('dozen1')}</div><div class="rout" data-bet="d2">${t('dozen2')}</div><div class="rout" data-bet="d3">${t('dozen3')}</div>`;
  // even-money row
  h += `<div class="rout even" data-bet="low" style="grid-column:${1+zcols}/span 2">${t('low')}</div><div class="rout even" data-bet="even">${t('even')}</div>`;
  h += `<div class="rout even" data-bet="red" style="background:#7a1f1a">${t('red')}</div><div class="rout even" data-bet="black" style="background:#111">${t('black')}</div>`;
  h += `<div class="rout even" data-bet="odd">${t('odd')}</div><div class="rout even" data-bet="high">${t('high')}</div>`;
  // columns row
  h += `<div class="rout" data-bet="c1" style="grid-column:${1+zcols}/span 4">2:1 ${t('col')} 1</div><div class="rout" data-bet="c2">2:1 ${t('col')} 2</div><div class="rout" data-bet="c3">2:1 ${t('col')} 3</div>`;
  // basket bet (double zero only)
  if(variant==='us') h += `<div class="rout" data-bet="basket" style="grid-column:${1+zcols}/span 12">${t('basket')}</div>`;
  g.innerHTML = h;
  g.querySelectorAll('[data-bet]').forEach(el=>{
    el.addEventListener('click', ()=>placeBet(el.dataset.bet, el));
  });
}
function betTotal(id){ return bets.filter(b=>b.id===id).reduce((a,b)=>a+b.amt,0); }
function placeBet(id, el){
  if(spinning) return;
  if(bankroll < chip){ log('⚠️ bankroll too low'); return; }
  bankroll -= chip;
  bets.push({id, amt:chip});
  renderBets(); renderStats();
}
function placeCallBet(name){
  if(spinning || variant!=='eu') return;
  const cb = CALLBETS[name];
  const total = cb.chips * chip;
  if(bankroll < total){ log('⚠️ bankroll too low'); return; }
  bankroll -= total;
  cb.parts.forEach(p=>{
    bets.push({id:'call:'+name, amt:chip*p.units, nums:p.nums, pay:p.pay, label:t(name)});
  });
  renderBets(); renderStats();
}
function renderCallBets(){
  const el = document.getElementById('callrow');
  if(variant!=='eu'){ el.style.display='none'; return; }
  el.style.display='';
}
function clearBets(){
  if(spinning) return;
  bets.forEach(b=>bankroll+=b.amt);
  bets=[]; renderBets(); renderStats();
}
function doSpin(){
  if(spinning || !bets.length) return;
  spinning = true;
  const btn=document.getElementById('spinbtn'); btn.textContent=t('spinning'); btn.disabled=true;
  const win = spinWheel(variant);
  // animate wheel
  const svg=document.getElementById('wheel');
  let rot=0; const target = 720 + Math.random()*360;
  const t0=performance.now();
  (function anim(now){
    const p=Math.min(1,(now-t0)/2000), e=1-Math.pow(1-p,3);
    drawWheel(svg, rot + target*e, p===1?win:-1, variant);
    if(p<1) requestAnimationFrame(anim);
    else resolve(win);
  })(t0);
}
function resolve(win){
  const lp = document.getElementById('lapartage').checked && variant==='eu';
  let ret=0, wonAny=false;
  const lines=[];
  bets.forEach(b=>{
    let r=0, note='';
    if(b.id==='basket'){
      if(BASKET_NUMS.some(x=>String(x)===String(win))){ r=b.amt*7; wonAny=true; note=`${t('won')} ${b.amt*6}`; }
    } else if(b.id.indexOf('call:')===0){
      if(b.nums.some(x=>String(x)===String(win))){ r=b.amt*(b.pay+1); wonAny=true; note=`${b.label} ${t('won')} ${b.amt*b.pay}`; }
    } else if(b.id[0]==='n'){
      const n=b.id.slice(1);
      if(String(win)===n){ r=b.amt*36; wonAny=true; note=`${t('won')} ${b.amt*35}`; }
    } else {
      const o=OUTSIDE.find(x=>x.id===b.id);
      if(!isZero(win) && o.test(win)){ r=b.amt*(o.pay+1); wonAny=true; note=`${t('won')} ${b.amt*o.pay}`; }
      else if(isZero(win) && o.even && lp){ r=b.amt/2; note=t('pushed_half'); }
    }
    ret+=r;
    if(r>0) lines.push(`${b.id}: +${r-b.amt}`);
  });
  bankroll+=ret;
  stats.spins++; stats.wagered+=bets.reduce((a,b)=>a+b.amt,0);
  if(wonAny) stats.wins++;
  const pl = ret - bets.reduce((a,b)=>a+b.amt,0);
  const color = isZero(win)?'#1e7a46':(isRed(win)?'#e05252':'#ccc');
  log(`<b style="color:${color}">${win}</b> ${pl>=0?'<span class="pos">+'+pl+'</span>':'<span class="neg">'+pl+'</span>'} ${lines.join(' · ')}`);
  // highlight winning number on layout
  document.querySelectorAll('.rnum').forEach(el=>el.classList.remove('winner'));
  const wEl=document.querySelector(`[data-num="${win}"]`);
  if(wEl) wEl.classList.add('winner');
  bets=[];
  renderBets(); renderStats();
  spinning=false;
  const btn=document.getElementById('spinbtn'); btn.textContent=t('spin'); btn.disabled=false;
}
function renderBets(){
  document.querySelectorAll('#rgrid .chip').forEach(c=>c.remove());
  const totals={};
  bets.forEach(b=>totals[b.id]=(totals[b.id]||0)+b.amt);
  Object.keys(totals).forEach(id=>{
    const el=document.querySelector(`[data-bet="${id}"]`);
    if(el){ const s=document.createElement('span'); s.className='chip'; s.textContent='$'+totals[id]; el.appendChild(s); }
  });
  const bl=document.getElementById('betlist');
  if(!bets.length) bl.innerHTML=`<p class="muted">${t('no_bets')}</p>`;
  else bl.innerHTML='<table class="data"><tr><th>Bet</th><th class="num">$</th></tr>'+
    Object.keys(totals).map(id=>{
      const b=bets.find(x=>x.id===id);
      const name = b&&b.label ? b.label : id;
      return `<tr><td>${name}</td><td class="num">${totals[id]}</td></tr>`;
    }).join('')+'</table>';
}
function renderStats(){
  const pl=bankroll-startBank;
  document.getElementById('bank').innerHTML=
    `<div class="stat"><div class="v">$${bankroll.toFixed(0)}</div><div class="l">${t('bankroll')}</div></div>
     <div class="stat"><div class="v ${pl>=0?'pos':'neg'}">${pl>=0?'+':''}$${pl.toFixed(0)}</div><div class="l">${t('pl')}</div></div>
     <div class="stat"><div class="v">${stats.spins}</div><div class="l">${t('spins')}</div></div>
     <div class="stat"><div class="v">${stats.spins?(stats.wins/stats.spins*100).toFixed(0)+'%':'–'}</div><div class="l">${t('hit_rate')}</div></div>`;
}
function newSession(){
  bankroll=startBank=+document.getElementById('s_bank').value||500;
  bets=[]; stats={spins:0,wins:0,wagered:0};
  document.getElementById('log').innerHTML='';
  document.querySelectorAll('.rnum').forEach(el=>el.classList.remove('winner'));
  drawWheel(document.getElementById('wheel'), 0, -1, variant);
  renderBets(); renderStats();
}
function log(m){ const el=document.getElementById('log'); el.innerHTML='<div>'+m+'</div>'+el.innerHTML; }
function setChip(v, el){
  chip=v;
  document.querySelectorAll('.pchip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
}
function onLangChange(){ buildLayout(); renderEdge(); renderBets(); renderStats(); renderCallBets(); }
</script>
</head>
<body>
<script>document.write(navHTML('simulator.html'));</script>
<div class="wrap"><section class="block">
<h1 style="color:var(--gold)" data-i18n="sim_title">Wheel Simulator</h1>
<p data-i18n="sim_intro"></p>
<div class="card" style="margin-bottom:16px">
  <div class="rowflex" style="align-items:center">
    <span><b data-i18n="variant">Wheel</b>:</span>
    <button class="btn small vbtn sel" data-v="eu" onclick="setVariant('eu')">0 · 2.70%</button>
    <button class="btn small vbtn" data-v="us" onclick="setVariant('us')">0, 00 · 5.26%</button>
    <button class="btn small vbtn" data-v="z3" onclick="setVariant('z3')">0, 00, 000 · 7.69%</button>
  </div>
  <div id="edgebar" class="mt"></div>
</div>
<div class="grid cols2">
<div>
  <div class="card center">
    <div class="wheel-wrap"><svg class="wheel" id="wheel" viewBox="0 0 200 200"></svg></div>
    <div class="mt"><button class="btn" id="spinbtn" style="font-size:1.3rem;padding:14px 44px" onclick="doSpin()" data-i18n="spin">SPIN</button></div>
    <div class="checkrow" style="justify-content:center"><input type="checkbox" id="lapartage"><label for="lapartage" data-i18n="lapartage"></label></div>
  </div>
  <div class="card"><h3 style="color:var(--gold);margin-top:0">💰 <span data-i18n="bankroll">Bankroll</span></h3>
    <div class="rowflex"><label class="f"><span data-i18n="bankroll">Bankroll</span><br><input type="number" id="s_bank" value="500" style="width:110px"></label>
    <button class="btn small" onclick="newSession()" data-i18n="new_session">New session</button></div>
    <div class="stat-grid" id="bank" style="margin-top:14px"></div>
  </div>
</div>
<div>
  <div class="card"><h3 style="color:var(--gold);margin-top:0">🎯 <span data-i18n="chip">Chip</span></h3>
    <div class="chiprack" id="chiprack">
      <div class="pchip" style="background:#2e7d32" onclick="setChip(1,this)">$1</div>
      <div class="pchip sel" style="background:#b03a2e" onclick="setChip(5,this)">$5</div>
      <div class="pchip" style="background:#1a1a1a" onclick="setChip(25,this)">$25</div>
      <div class="pchip" style="background:#5d3a9e" onclick="setChip(100,this)">$100</div>
    </div>
    <div class="rlayout"><div class="rgrid" id="rgrid"></div></div>
    <div class="rowflex"><button class="btn small danger" onclick="clearBets()" data-i18n="clear">Clear bets</button></div>
    <div id="callrow" class="mt">
      <b data-i18n="callbets">French call bets</b>
      <div class="rowflex" style="margin-top:6px">
        <button class="btn small ghost" onclick="placeCallBet('voisins')" data-i18n="voisins">Voisins du Zéro</button>
        <button class="btn small ghost" onclick="placeCallBet('tiers')" data-i18n="tiers">Tiers du Cylindre</button>
        <button class="btn small ghost" onclick="placeCallBet('orphelins')" data-i18n="orphelins">Orphelins</button>
        <button class="btn small ghost" onclick="placeCallBet('jeuzero')" data-i18n="jeuzero">Jeu Zéro</button>
      </div>
    </div>
  </div>
  <div class="card"><h3 style="color:var(--gold);margin-top:0">🎯 <span data-i18n="your_bets">Your bets</span></h3><div id="betlist"></div></div>
  <div class="card"><h3 style="color:var(--gold);margin-top:0">📝 <span data-i18n="result">Result</span></h3><div class="log" id="log"></div></div>
</div>
</div>
<script>document.write(disclosure());</script>
</section></div>
<script>document.write(adSlot());</script>
<script>document.write(footerHTML());</script>
<script>buildLayout();renderEdge();drawWheel(document.getElementById('wheel'),0,-1,'eu');renderBets();renderStats();renderCallBets();</script>
</body>
</html>
